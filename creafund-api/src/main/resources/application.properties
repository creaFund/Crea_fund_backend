spring.application.name=creafund-api
# PORT DU SERVEUR
#server.port=8080

# URL DE LA BASE DE DONNÉES
spring.datasource.url=${Sene_Db_Url}
spring.datasource.username=${Sene_Db_Username}
spring.datasource.password=${Sene_Db_Password}
logging.level.org.springframework=DEBUG

# DRIVER
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / HIBERNATE
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# CONFIG JSON
spring.jackson.serialization.indent_output=true

spring.jackson.serialization.FAIL_ON_EMPTY_BEANS=false


# UTF-8 PAR DÉFAUT
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# LOGGING
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
spring.profiles.active=dev

cloud.aws.region.static=eu-north-1
aws.s3.bucket=creafundback
aws.bucket.name=creafundback

spring.servlet.multipart.max-file-size=70MB
spring.servlet.multipart.max-request-size=70MB

# Mail Configuration
spring.mail.host=email-smtp.eu-north-1.amazonaws.com
spring.mail.port=465
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.transport.protocol=smtp

